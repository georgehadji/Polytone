<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Polytone — Πολυτονιστής</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #faf8f4; --ink: #1a1a1a; --accent: #7c5c34; --border: #d8d2c6; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.2rem; background: var(--bg); color: var(--ink);
         font-family: Georgia, 'Times New Roman', serif; }
  h1 { font-size: 1.3rem; margin: 0 0 .8rem; color: var(--accent); }
  .cols { display: flex; gap: 1rem; flex-wrap: wrap; }
  .col { flex: 1 1 320px; display: flex; flex-direction: column; gap: .5rem; }
  textarea, .out { width: 100%; min-height: 340px; padding: .7rem; font-size: 1.05rem;
    line-height: 1.7; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; font-family: inherit; }
  .out { white-space: pre-wrap; overflow-y: auto; }
  .out .unknown { background: #ffd9d9; }
  .out .ambiguous { background: #ffe9c7; }
  .out .guessed { background: #dde8ff; }
  .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  button { padding: .45rem .9rem; font-size: .95rem; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  .legend { font-size: .8rem; color: #666; }
  .legend span { padding: 0 .35rem; border-radius: 3px; }
  #status { font-size: .85rem; color: #666; }
  .drop { border: 2px dashed var(--border); border-radius: 6px; padding: .5rem .8rem;
    font-size: .85rem; color: #666; }
  .drop.over { border-color: var(--accent); }
</style>
</head>
<body>
<h1>Polytone — μονοτονικὸ ➝ πολυτονικό</h1>
<div class="cols">
  <div class="col">
    <div class="bar">
      <label class="drop" id="drop">Σύρε ἐδῶ ἢ <input type="file" id="file" accept=".txt,.docx"> (.txt / .docx)</label>
    </div>
    <textarea id="in" placeholder="Ἐπικόλλησε μονοτονικὸ ἢ μικτὸ κείμενο…"></textarea>
  </div>
  <div class="col">
    <div class="bar">
      <button id="copy">Ἀντιγραφή</button>
      <button id="save" class="ghost">Ἀποθήκευση .txt</button>
      <span id="status"></span>
    </div>
    <div class="out" id="out"></div>
    <div class="legend">
      <span class="unknown">ἄγνωστη</span>
      <span class="ambiguous">διφορούμενη</span>
      <span class="guessed">εἰκασία πνεύματος</span>
    </div>
  </div>
</div>

<script src="lexicon.js"></script>
<script src="engine.browser.js"></script>
<script src="jszip.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let lastText = '';

function convert() {
  const src = $('in').value;
  if (!src.trim()) { $('out').innerHTML = ''; $('status').textContent = ''; return; }
  const t0 = performance.now();
  const r = window.Polytone.polytonize(src, window.LEXICON);
  lastText = r.text;
  const marked = r.tokens.filter((t) => t.status !== 'ok' && t.status !== 'skipped');
  // ponytail: ένα πέρασμα, χάρτης out->status. Χρωματίζεται ΚΑΘΕ εμφάνιση σημαδεμένης
  // λέξης, όχι μόνο εκείνη που σημαδεύτηκε — ίδια συμπεριφορά με πρίν· ακριβής θέση
  // θα απαιτούσε character offsets από τη μηχανή (αύξηση δημόσιου API). status είναι
  // πάντα ένα από τα πέντε literals της μηχανής, οπότε η CSS-class/title interpolation
  // παρακάτω μένει ασφαλής.
  const st = new Map(marked.map((t) => [t.out, t.status]));
  $('out').innerHTML = esc(r.text)
    .replace(/[̀-ͯͰ-Ͽἀ-῿]+/gu, (w) => {
      const s = st.get(w);
      return s ? `<span class="${s}" title="${s}">${w}</span>` : w;
    });
  const n = r.tokens.length;
  const bad = marked.length;
  $('status').textContent = `${n} λέξεις, ${bad} πρὸς ἔλεγχο, ${(performance.now() - t0).toFixed(0)}ms`;
}

let timer;
$('in').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(convert, 300); });

$('copy').onclick = () => navigator.clipboard.writeText(lastText)
  .then(() => $('status').textContent = 'ἀντιγράφηκε ✓');

$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastText], { type: 'text/plain;charset=utf-8' }));
  a.download = 'polytonic.txt';
  a.click();
};

// ---- Ἀρχεῖα ----
async function handleFile(f) {
  try {
    if (f.name.toLowerCase().endsWith('.docx')) {
      const zip = await JSZip.loadAsync(f);
      for (const name of Object.keys(zip.files).filter((n) => window.Polytone.DOCX_PARTS.test(n))) {
        const xml = await zip.file(name).async('string');
        // ponytail: όριο ΜΕΤΑ την αποσυμπίεση — φράζει την έξοδο, όχι τη μνήμη της JSZip.
        if (xml.length > 64e6) throw new Error(`${name}: υπερβαίνει το όριο μεγέθους`);
        zip.file(name, window.Polytone.convertDocxXml(xml, window.LEXICON));
      }
      const blob = await zip.generateAsync({ type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = f.name.replace(/\.docx$/i, '.poly.docx');
      a.click();
      $('status').textContent = `docx ἕτοιμο: ${a.download}`;
    } else {
      $('in').value = await f.text();
      convert();
    }
  } catch (e) {
    $('status').textContent = 'σφάλμα ἀρχείου: ' + (e?.message ?? e);
  }
}
$('file').addEventListener('change', (e) => e.target.files[0] && handleFile(e.target.files[0]));
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
